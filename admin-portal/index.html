<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin Bar · Control</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0b0f19; color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px;
      background: #131826; border: 1px solid #232a3b; border-radius: 16px;
      padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    .brand { font-size: 12px; letter-spacing: 2px; color: #4f7cff; text-transform: uppercase; margin: 0 0 10px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #8b93a7; margin: 0 0 22px; }
    label { display: block; font-size: 12px; color: #9aa3b7; margin: 14px 0 6px; }
    input[type="email"], input[type="password"], input[type="number"] {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid #2c344a; background: #0e1320; color: #e5e7eb; font-size: 14px;
    }
    input:focus { outline: none; border-color: #4f7cff; }
    button {
      width: 100%; margin-top: 18px; padding: 12px; border: none; border-radius: 10px;
      background: #4f7cff; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { background: transparent; border: 1px solid #2c344a; color: #9aa3b7; margin-top: 10px; }
    .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 18px; }
    .msg.err { color: #f87171; }
    .msg.ok { color: #34d399; }
    .hidden { display: none; }
    .status {
      display: flex; align-items: center; gap: 10px;
      padding: 14px; border-radius: 12px; margin-bottom: 6px;
      background: #0e1320; border: 1px solid #2c344a;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; flex: none; }
    .dot.on { background: #34d399; box-shadow: 0 0 12px #34d399; }
    .status-text { font-size: 14px; font-weight: 600; }
    .switch { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .toggle {
      position: relative; width: 52px; height: 30px; border-radius: 999px;
      background: #2c344a; cursor: pointer; transition: background .2s; flex: none;
    }
    .toggle.on { background: #34d399; }
    .toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 24px; height: 24px; border-radius: 50%; background: white; transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(22px); }
    .who { font-size: 11px; color: #6b7280; text-align: center; margin-top: 16px; }
    .center { text-align: center; color: #8b93a7; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <!-- CARGANDO -->
    <div id="loadingView">
      <p class="center">Cargando…</p>
    </div>

    <!-- LOGIN -->
    <div id="loginView" class="hidden">
      <p class="brand">Admin Bar</p>
      <h1>Panel de control</h1>
      <p class="sub">Solo super administradores.</p>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="loginBtn" type="submit">Entrar</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- PANEL -->
    <div id="panelView" class="hidden">
      <p class="brand">Admin Bar</p>
      <h1>Modo Demo de Caja</h1>
      <p class="sub">Ajusta el efectivo reportado en el resumen diario.</p>

      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText" class="status-text">Cargando…</span>
      </div>

      <div class="switch">
        <span style="font-size:14px;">Activar modo demo</span>
        <div id="toggle" class="toggle"></div>
      </div>

      <label for="factor">Factor de efectivo (ej. 0.85 = mostrar 85%)</label>
      <input id="factor" type="number" min="0" max="1" step="0.01" value="0.85" />

      <button id="saveBtn" type="button">Guardar cambios</button>
      <button id="logoutBtn" class="ghost" type="button">Cerrar sesión</button>
      <div id="panelMsg" class="msg"></div>
      <div id="who" class="who"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, onSnapshot, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    // ⚠️ Debe apuntar al MISMO proyecto Firebase que usa wikka.uphy.mx (creds WIKKAS / bar-pos-qa).
    const firebaseConfig = {
      apiKey: "AIzaSyCMEtCPrQ9up8Zuf-4fMV3gLSbGx4Jjvb8",
      authDomain: "bar-pos-qa.firebaseapp.com",
      projectId: "bar-pos-qa",
      storageBucket: "bar-pos-qa.firebasestorage.app",
      messagingSenderId: "1067411561013",
      appId: "1:1067411561013:web:acc0ef131e9120f113ef7c",
    };

    const REDIRECT_URL = "https://wikka.uphy.mx";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const configRef = doc(db, "config", "demoCash");

    const $ = (id) => document.getElementById(id);
    const loadingView = $("loadingView"), loginView = $("loginView"), panelView = $("panelView");
    const loginMsg = $("loginMsg"), panelMsg = $("panelMsg");
    const toggle = $("toggle"), factorInput = $("factor");
    const statusDot = $("statusDot"), statusText = $("statusText");

    let pendingEnabled = false;
    let unsubConfig = null;

    function show(view) {
      loadingView.classList.add("hidden");
      loginView.classList.add("hidden");
      panelView.classList.add("hidden");
      view.classList.remove("hidden");
    }
    function renderStatus(enabled, factor) {
      statusDot.classList.toggle("on", enabled);
      statusText.textContent = enabled
        ? `ACTIVO · mostrando ${Math.round(factor * 100)}% del efectivo`
        : "DESACTIVADO · efectivo real";
    }
    function setToggle(on) {
      pendingEnabled = on;
      toggle.classList.toggle("on", on);
    }

    // Login
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMsg.textContent = ""; loginMsg.className = "msg";
      $("loginBtn").disabled = true;
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
        // onAuthStateChanged se encarga de validar superAdmin.
      } catch (err) {
        loginMsg.textContent = "Correo o contraseña incorrectos.";
        loginMsg.className = "msg err";
        $("loginBtn").disabled = false;
      }
    });

    toggle.addEventListener("click", () => setToggle(!pendingEnabled));
    $("logoutBtn").addEventListener("click", () => signOut(auth));

    // Guardar
    $("saveBtn").addEventListener("click", async () => {
      panelMsg.textContent = ""; panelMsg.className = "msg";
      const factor = parseFloat(factorInput.value);
      if (isNaN(factor) || factor < 0 || factor > 1) {
        panelMsg.textContent = "El factor debe estar entre 0 y 1.";
        panelMsg.className = "msg err";
        return;
      }
      $("saveBtn").disabled = true;
      try {
        await setDoc(configRef, {
          enabled: pendingEnabled,
          factor,
          updatedAt: serverTimestamp(),
          updatedBy: auth.currentUser?.email || "desconocido",
        }, { merge: true });
        panelMsg.textContent = "Cambios guardados ✓";
        panelMsg.className = "msg ok";
      } catch (err) {
        panelMsg.textContent = "No se pudo guardar.";
        panelMsg.className = "msg err";
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    // Sesión + validación superAdmin (misma lógica que la app: users/{uid})
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        if (unsubConfig) { unsubConfig(); unsubConfig = null; }
        $("loginBtn").disabled = false;
        $("email").value = ""; $("password").value = "";
        show(loginView);
        return;
      }

      // Validar rol en Firestore
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() : null;
        const isSuperAdmin = data && data.active !== false && data.superAdmin === true;

        if (!isSuperAdmin) {
          await signOut(auth);
          window.location.replace(REDIRECT_URL);
          return;
        }
      } catch (err) {
        await signOut(auth);
        window.location.replace(REDIRECT_URL);
        return;
      }

      // Autorizado
      $("who").textContent = "Sesión: " + user.email;
      show(panelView);
      unsubConfig = onSnapshot(configRef, (snap) => {
        const d = snap.data() || {};
        const enabled = Boolean(d.enabled);
        const factor = typeof d.factor === "number" ? d.factor : 0.85;
        setToggle(enabled);
        factorInput.value = factor;
        renderStatus(enabled, factor);
      });
    });
  </script>
</body>
</html>
